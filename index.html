<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <title>Wayvida</title>
    <link rel="icon" type="image/png" href="/wayvida-logo-transparent.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>Wayvida Books needs JavaScript enabled.</noscript>
    <script>
      (function(){
        var c=globalThis.crypto;
        if(!c||typeof c.randomUUID==='function')return;
        c.randomUUID=function(){
          var b=new Uint8Array(16),i,h='';
          if(c.getRandomValues)c.getRandomValues(b);
          else for(i=0;i<16;i++)b[i]=Math.random()*256|0;
          b[6]=(b[6]&15)|64;b[8]=(b[8]&63)|128;
          for(i=0;i<16;i++)h+=(b[i]+256).toString(16).slice(1);
          return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20);
        };
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
