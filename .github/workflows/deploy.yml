name: Deploy Finance Admin

on:
  push:
    branches:
      - main

# Prevent two deployments from running at the same time
concurrency:
  group: finance-admin-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to On-Prem Server
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Setup SSH directory
      # --------------------------------------------------
      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -e

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key

          chmod 600 ~/.ssh/deploy_key

          echo "SSH key prepared."


      # --------------------------------------------------
      # 3. Add SSH key to agent
      #    Handles passphrase-protected PEM
      # --------------------------------------------------
      - name: Start SSH Agent
        env:
          SSH_PASSPHRASE: ${{ secrets.SERVER_SSH_PASSPHRASE }}
        run: |
          set -e

          eval "$(ssh-agent -s)"

          cat > ~/.ssh/ssh-askpass.sh << 'EOF'
          #!/bin/sh
          printf '%s\n' "$SSH_PASSPHRASE"
          EOF

          chmod 700 ~/.ssh/ssh-askpass.sh

          export SSH_ASKPASS="$HOME/.ssh/ssh-askpass.sh"
          export SSH_ASKPASS_REQUIRE=force
          export DISPLAY=:0

          ssh-add ~/.ssh/deploy_key

          echo "SSH key successfully added to agent."


      # --------------------------------------------------
      # 4. Add server host key
      # --------------------------------------------------
      - name: Add server to known hosts
        run: |
          set -e

          ssh-keyscan \
            -p "${{ secrets.SERVER_PORT }}" \
            "${{ secrets.SERVER_HOST }}" \
            >> ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

          echo "Server added to known_hosts."


      # --------------------------------------------------
      # 5. Test SSH connection
      # --------------------------------------------------
      - name: Test SSH connection
        run: |
          set -e

          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -p "${{ secrets.SERVER_PORT }}" \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "echo 'SSH connection successful'"


      # --------------------------------------------------
      # 6. Deploy application
      # --------------------------------------------------
      - name: Deploy application
        run: |
          set -e

          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -p "${{ secrets.SERVER_PORT }}" \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" << 'EOF'

            set -e

            echo "========================================="
            echo "Starting Finance Admin deployment"
            echo "========================================="

            PROJECT_DIR="/home/devuser/projects/Finance_admin"

            echo ""
            echo "Changing directory..."
            cd "$PROJECT_DIR"

            echo "Current directory:"
            pwd

            echo ""
            echo "Current commit:"
            git rev-parse --short HEAD || true

            echo ""
            echo "Fetching latest code..."
            git fetch origin main

            echo ""
            echo "Updating working tree..."
            git reset --hard origin/main

            echo ""
            echo "New commit:"
            git rev-parse --short HEAD

            echo ""
            echo "Building and starting Docker containers..."

            docker compose up -d --build --remove-orphans

            echo ""
            echo "Checking container status..."

            docker compose ps

            echo ""
            echo "Cleaning unused Docker images..."

            docker image prune -f

            echo ""
            echo "========================================="
            echo "Deployment completed successfully"
            echo "========================================="

          EOF


      # --------------------------------------------------
      # 7. Deployment summary
      # --------------------------------------------------
      - name: Deployment completed
        run: |
          echo "========================================="
          echo "Finance Admin deployment successful"
          echo "Branch: main"
          echo "Server: ${{ secrets.SERVER_HOST }}"
          echo "========================================="
