server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /api/ {
    default_type application/json;
    return 404 '{"error":"not found"}';
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
